modLoader="javafml"
loaderVersion="[1,)"
license="MIT"
displayTest="IGNORE_SERVER_VERSION"

[[mods]]
modId="tpa"
version="${mod_version}"
displayName="Tpa"
authors="${mod_authors}"
description="""
EssentialsX-style teleport requests: /tpa, /tpahere, /tpaccept, /tpdeny, /tpacancel.
No op, cheats or permissions plugin required.
"""

[[dependencies.tpa]]
    modId="neoforge"
    mandatory=true
    versionRange="[1,)"
    ordering="NONE"
    side="BOTH"

[[dependencies.tpa]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
