plugins { id 'net.fabricmc.fabric-loom' version "${loom_version}" }
version = project.mod_version
group = project.maven_group
base { archivesName = "tpa-26.1.2-fabric" }
repositories { }
loom { mods { "tpa" { sourceSet sourceSets.main } } }
dependencies {
 minecraft "com.mojang:minecraft:${project.minecraft_version}"
 implementation "net.fabricmc:fabric-loader:${project.loader_version}"
 implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
 testImplementation "org.junit.jupiter:junit-jupiter:5.10.3"
 testRuntimeOnly "org.junit.platform:junit-platform-launcher:1.10.3"
}
processResources { inputs.property "version", version; filesMatching("fabric.mod.json") { expand "version": version } }
tasks.withType(JavaCompile).configureEach { options.release = 25 }
java { sourceCompatibility = JavaVersion.VERSION_25; targetCompatibility = JavaVersion.VERSION_25 }
test { useJUnitPlatform(); testLogging { events "passed", "failed", "skipped" } }

// Product jar never ships the in-game probe.
tasks.named('jar') { exclude 'com/frameflags/tpa_test/**' }

// Test-only probe jar, staged separately by CI. 26.x ships named classes, so no
// intermediary remap step is needed (matches KeepInventoryPorts/26.3-fabric).
tasks.register('testmodJar', Jar) {
  archiveBaseName = "tpa-testmod-26.1.2-fabric"
  from(sourceSets.main.output.classesDirs) { include 'com/frameflags/tpa_test/**' }
  from('src/testmod/resources')
}
build.dependsOn testmodJar
